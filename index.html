<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Índices Moveleiro</title>

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #0f0f0f;
      color: #eaeaea;
    }
  </style>
</head>

<body>

  <!-- Hidden logo used only for PDF export -->
  <img
    id="pdfLogo"
    src="ckstsourcinglogoAtivo 1Openfield MV logo.png"
    style="display:none"
  />

  <!-- ======================================================
       YOUR EXISTING DASHBOARD CONTENT STAYS UNCHANGED
       (charts with ids below must already exist)
       chartOverview
       chartCRC
       chartIronOre
       chartFreight
       chartFX
  ======================================================= -->

<script>
async function exportAllToPDF() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p", "mm", "a4");

  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();

  // Layout
  const marginX = 15;
  const topMargin = 28;
  const spacing = 12;

  const usableWidth = pageWidth - marginX * 2;
  const chartHeight = (pageHeight - topMargin * 2 - spacing) / 2;

  let currentY = topMargin;
  let chartsOnPage = 0;
  let firstPage = true;

  const logo = document.getElementById("pdfLogo");

  const charts = [
    { id: "chartOverview", title: "Visão Geral" },
    { id: "chartCRC", title: "CRC Steel" },
    { id: "chartIronOre", title: "Minério de Ferro" },
    { id: "chartFreight", title: "Frete Internacional" },
    { id: "chartFX", title: "Câmbio" }
  ];

  for (const chart of charts) {
    const el = document.getElementById(chart.id);
    if (!el) continue;

    // New page after 2 charts
    if (chartsOnPage === 2) {
      pdf.addPage();
      currentY = topMargin;
      chartsOnPage = 0;
      firstPage = false;
    }

    // Logo only on first page
    if (firstPage && chartsOnPage === 0 && logo) {
      pdf.addImage(logo, "PNG", marginX, 12, 35, 10);
      currentY += 6;
    }

    // Chart title
    pdf.setFontSize(11);
    pdf.text(chart.title, marginX, currentY);
    currentY += 4;

    // Export chart
    const img = await Plotly.toImage(el, {
      format: "png",
      scale: 2
    });

    pdf.addImage(
      img,
      "PNG",
      marginX,
      currentY,
      usableWidth,
      chartHeight
    );

    currentY += chartHeight + spacing;
    chartsOnPage++;
  }

  pdf.save("Indices_Moveleiro.pdf");
}
</script>

</body>
</html>
